<script>
const API='https://late-forest-4748.dreamsicreation.workers.dev/'; // Cloudflare Worker URL
const P={students:['student_login','Students'],enrollments:['student_enrolled','Enrollments'],courses:['course_name','Courses'],subjects:['subjectwise_course_name','Subject-wise Courses'],teachers:['teachers','Teachers'],free:['free_class','Free Classes'],gallery:['gallery','Gallery / Reviews'],shop:['shop_item','Shop Products'],orders:['shop_orders','Shop Orders'],admins:['admin_login','Admin Accounts']};
const CT=[['course_data_ssc','SSC'],['course_data_hsc','HSC'],['course_data_mba','MBA'],['course_data_bbs','BBS'],['course_data_bba_professional','BBA Professional'],['course_data_bba_nu','BBA NU'],['course_data_bba_dcu','BBA DCU']];
let S={token:localStorage.va_admin_token||'',user:null,table:null,cols:[],rows:[],search:'',courseFilter:'',offset:0,limit:100};
const ENROLL_TABLE='student_enrolled';
const STUDENT_TABLE='student_login';
const ENROLL_EDITABLE_FIELDS=['expires_at','paid','next_date'];
const ENROLL_HIDDEN_FIELDS=['get_wt','blocked'];
function isEnrollTable(){return S.table===ENROLL_TABLE}
function isStudentTable(){return S.table===STUDENT_TABLE}
const pageCache=new Map();
let searchTimer=null;
let refreshSeq=0;
function cacheKey(){return S.table||''}
function getCache(){return pageCache.get(cacheKey())||null}
function setCache(data){pageCache.set(cacheKey(),data)}
function setPanelLoading(message='Loading database…'){
  const q=document.getElementById('panel');
  if(!q)return;
  q.classList.add('is-loading');
  q.insertAdjacentHTML('afterbegin','<div class="smooth-loading" id="inlineLoading"><div class="spinner"></div><div>'+esc(message)+'</div></div>');
}
function clearPanelLoading(){
  const q=document.getElementById('panel');
  if(!q)return;
  const x=q.querySelector('#inlineLoading');
  if(x)x.remove();
  q.classList.remove('is-loading');
}
function filterRows(rows, search){
  const q=String(search??'').trim().toLowerCase();
  if(!q)return rows.slice();
  return rows.filter(row=>{
    return Object.entries(row||{}).some(([key,value])=>{
      if(String(key)==='__rowid')return false;
      return cellValue(value).toLowerCase().includes(q);
    });
  });
}
function matchesCourseFilter(row){
  if(!isEnrollTable())return true;
  const want=String(S.courseFilter||'').trim().toLowerCase();
  if(!want)return true;
  return cellValue(row?.course).trim().toLowerCase()===want;
}
function visibleRows(cache){
  if(!cache)return [];
  return filterRows(cache.allRows,S.search).filter(matchesCourseFilter);
}
function populateCourseFilter(cache){
  const sel=document.getElementById('courseFilter');
  if(!sel||!cache)return;
  const names=Array.from(new Set(
    (cache.allRows||[]).map(r=>cellValue(r.course).trim()).filter(Boolean)
  )).sort((a,b)=>a.localeCompare(b));
  if(S.courseFilter && !names.some(n=>n.toLowerCase()===S.courseFilter.toLowerCase()))S.courseFilter='';
  sel.innerHTML='<option value="">সব কোর্স (All Courses)</option>'+
    names.map(n=>`<option value="${esc(n)}" ${n===S.courseFilter?'selected':''}>${esc(n)}</option>`).join('');
  sel.value=S.courseFilter||'';
}
function setCourseFilter(value){
  S.courseFilter=String(value||'');
  S.offset=0;
  renderCachedRows();
}
function renderCachedRows(){
  const cache=getCache();
  if(!cache)return false;
  S.cols=cache.cols.slice();
  const filtered=visibleRows(cache);
  const total=filtered.length;
  S.rows=filtered.slice(S.offset,S.offset+S.limit);
  renderTable({
    rows:S.rows,
    total:total,
    offset:S.offset,
    limit:S.limit,
    label:cache.label||P[S.table]?.[1]||S.table,
    local:true
  });
  return true;
}
function liveSearch(value){
  S.search=value;
  S.offset=0;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    renderCachedRows();
    const input=document.getElementById('search');
    if(input){
      input.focus();
      try{input.setSelectionRange(input.value.length,input.value.length)}catch{}
    }
  },80);
}
function clearSearch(){
  const input=document.getElementById('search');
  if(input){input.value='';input.focus();}
  liveSearch('');
}

try{S.user=JSON.parse(localStorage.va_admin_user||'null')}catch{S.user=null}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(x){toastEl.textContent=x;toastEl.classList.remove('hidden');setTimeout(()=>toastEl.classList.add('hidden'),2300)}const toastEl=document.getElementById('toast');
async function api(action,o={}){
  const actionMap={
    admin_dashboard:'panel_admin_dashboard',
    admin_table_schema:'panel_admin_schema',
    admin_rows:'panel_admin_rows',
    admin_save:'panel_admin_save',
    admin_delete:'panel_admin_delete',
    admin_reset_password:'panel_admin_reset_password',
    get_pending_requests:'panel_admin_pending',
    approve_enrollment:'panel_admin_approve',
    get_enrolled_students:'panel_admin_enrolled_students',
    set_course_lock:'panel_admin_lock',
    set_get_wt:'panel_admin_watch_gate'
  };
  const serverAction=actionMap[action]||action;
  const body={action:serverAction,...o,adminToken:S.token};
  let r=await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body),
    cache:'no-store'
  });
  let j;
  try{ j=await r.json(); }
  catch(e){ throw Error(`Worker response invalid (HTTP ${r.status})`); }
  if(!r.ok) throw Error(j?.message||`Worker HTTP ${r.status}`);
  if(j?.status==='error') throw Error(j.message||'Worker error');
  return j;
}
async function doLogin(m,p){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'panel_admin_login',mobile:m,password:p}),cache:'no-store'});
  let j;try{j=await r.json()}catch{throw Error(`Worker response invalid (HTTP ${r.status})`)}
  if(!r.ok||j?.status==='error')throw Error(j?.message||`Login failed (HTTP ${r.status})`);
  if(!j?.data?.adminToken)throw Error('Login succeeded but admin session token was not returned.');
  return j;
}
const MASTER_ONLY_PAGES=new Set(['courses','content','subjects','teachers','free','gallery','shop','orders','admins']);
function isMasterAdmin(){return String(S.user?.adminStatus||'').trim()==='Master Admin'}
function applyRoleVisibility(){
  const master=isMasterAdmin();
  document.querySelectorAll('.master-only').forEach(b=>b.classList.toggle('hidden',!master));
  who.textContent='Signed in: '+(S.user?.name||'Admin');
}
function logout(){localStorage.removeItem('va_admin_token');localStorage.removeItem('va_admin_user');location.reload()}function show(){login.classList.add('hidden');app.classList.remove('hidden');applyRoleVisibility();page('dashboard')}
lf.onsubmit=async e=>{e.preventDefault();try{let j=await doLogin(lm.value.trim(),lp.value);S.token=j.data.adminToken;S.user=j.data;localStorage.va_admin_token=S.token;localStorage.va_admin_user=JSON.stringify(S.user);show()}catch(e){le.textContent=e.message}}
nav.onclick=e=>{let b=e.target.closest('[data-p]');if(b)page(b.dataset.p)}
async function page(p){if(MASTER_ONLY_PAGES.has(p)&&!isMasterAdmin()){toast('এই সেকশনে প্রবেশের অনুমতি নেই');p='dashboard'}document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='dashboard')return dashboard();if(p==='pending')return pending();if(p==='content')return contentPage();S.table=P[p][0];S.offset=0;S.search='';S.courseFilter='';
if(S.table===ENROLL_TABLE){
  content.innerHTML=`<h1 class="title">${esc(P[p][1])}</h1>
    <div class="filter-bar">
      <label for="courseFilter">Course</label>
      <select id="courseFilter" onchange="setCourseFilter(this.value)">
        <option value="">সব কোর্স (All Courses)</option>
      </select>
    </div>
    <div id="panel" class="panel"></div>`;
}else{
  content.innerHTML=`<h1 class="title">${esc(P[p][1])}</h1><p class="muted">Add, edit, delete and search database records.</p><div id="panel" class="panel"></div>`;

function colName(c){
  if(typeof c==='string') return c;
  if(!c || typeof c!=='object') return '';
  return String(c.name ?? c.column_name ?? c.key ?? c.columnName ?? '');
}
function colType(c){
  if(!c || typeof c!=='object') return 'TEXT';
  return String(c.type ?? 'TEXT').toUpperCase();
}
function cellValue(v){
  if(v===null || v===undefined) return '';
  if(typeof v==='object'){
    try{return JSON.stringify(v);}
    catch{return '[Object]';}
  }
  return String(v);
}
function shortValue(v,max=180){
  const s=cellValue(v);
  return s.length>max ? s.slice(0,max-1)+'…' : s;
}
function isSecretColumn(c){
  return /^(password|active_token|token|secret)$/i.test(colName(c));
}
function isLargeColumn(c){
  const n=colName(c);
  return /description|long_description|text|address|url|link|feature|chapter|class|content|details|note|message|json|data|image/i.test(n);
}
function inputValue(v){
  return cellValue(v);
}
function renderCell(v,c){
  const name=colName(c);
  if(isSecretColumn(c)) return '<span class="secret">••••••••</span>';
  const previewMax=isLargeColumn(c)?55:180;
  const s=shortValue(v,previewMax);
  if(!s) return '<span class="muted">—</span>';
  if(/^https?:\/\//i.test(s)){
    const safe=esc(s);
    return `<a class="compact-link" href="${safe}" target="_blank" rel="noopener noreferrer" title="${safe}" aria-label="Open link">↗</a>`;
  }
  if(/^(true|false|yes|no)$/i.test(s.trim())){
    const on=/^(true|yes)$/i.test(s.trim());
    return `<span class="badge ${on?'on':'off'}">${esc(s)}</span>`;
  }
  return `<span title="${esc(cellValue(v))}">${esc(s)}</span>`;
}

function moneyNumber(v){

function fmtMoney(n){

async function refresh(force=false){
  const q=document.getElementById('panel');
  if(!q)return;

  // Normal page visit: use browser-memory cache if available.
  if(!force){
    const cache=getCache();
    if(cache){
      S.search='';
      S.offset=0;
      S.cols=cache.cols.slice();
      populateCourseFilter(cache);
      renderCachedRows();
      return;
    }
  }

  const requestId=++refreshSeq;
  q.classList.remove('is-loading');
  q.innerHTML='<div class="smooth-loading"><div class="spinner"></div><div>Loading database…</div><div class="search-status">Loading fresh data into browser memory</div></div>';

  try{
    const schemaResponse=await api('admin_table_schema',{table:S.table});
    if(requestId!==refreshSeq)return;
    const schemaData=schemaResponse.data;
    S.cols=Array.isArray(schemaData)?schemaData:(schemaData?.columns||[]);
    const cols=S.cols.map(colName).filter(Boolean);

    // Load the complete dataset once for this table. Search is performed locally afterward.
    const response=await api('admin_rows',{
      table:S.table,
      search:'',
      offset:0,
      limit:1000000
    });
    if(requestId!==refreshSeq)return;

    const d=response.data||{};
    const allRows=Array.isArray(d.rows)?d.rows:[];
    setCache({
      allRows:allRows,
      cols:S.cols.slice(),
      label:d.label||P[S.table]?.[1]||S.table,
      loadedAt:Date.now()
    });

    S.search='';
    S.offset=0;
    populateCourseFilter(getCache());
    renderCachedRows();
  }catch(e){
    q.innerHTML=`<div class="empty error-box"><b>Could not load this table</b><br>${esc(e.message||e)}</div>`;
  }
}
function localPage(direction){
  const cache=getCache();
  if(!cache)return;
  const filtered=visibleRows(cache);
  const total=filtered.length;
  S.offset=Math.max(0,Math.min(S.offset+direction*S.limit,Math.max(0,total-S.limit)));
  const pageRows=filtered.slice(S.offset,S.offset+S.limit);
  renderTable({
    rows:pageRows,
    total:total,
    offset:S.offset,
    limit:S.limit,
    label:cache.label||P[S.table]?.[1]||S.table,
    local:true
  });
}

function enrollDateInputValue(name,v){
  if(!v)return '';
  if(name==='expires_at')return v.slice(0,10);
  const m=/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})$/.exec(String(v).trim());
  if(m){
    const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monIdx=MO.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
    if(monIdx>=0){
      const pad=n=>String(n).padStart(2,'0');
      return `${m[3]}-${pad(monIdx+1)}-${pad(Number(m[1]))}`;
    }
  }
  const d=new Date(v);
  if(!isNaN(d.getTime())){
    const pad=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  return '';
}

  try{
    await api('admin_save',{table:S.table,rowid:Number(rid.value)||0,data:d});
    pageCache.delete(cacheKey());
    toast('Saved successfully');
    closeDrawer();
    refresh();
  }catch(e){toast(e.message||'Save failed')}
}
function closeDrawer(){drawer.classList.add('hidden')}
async function del(id){
  if(!confirm(`Delete row #${id} permanently?\n\nThis cannot be undone.`))return;
  try{
    await api('admin_delete',{table:S.table,rowid:id});
    pageCache.delete(cacheKey());
    toast('Deleted successfully');
    if(S.offset>0 && S.rows.length===1)S.offset=Math.max(0,S.offset-S.limit);
    refresh();
  }catch(e){toast(e.message||'Delete failed')}
}
async function pw(id){
  const p=prompt('New password (minimum 4 characters):');
  if(!p)return;
  if(p.length<4){toast('Password must be at least 4 characters');return}
  try{
    await api('admin_reset_password',{table:'student_login',rowid:id,password:p});
    toast('Password updated');
  }catch(e){toast(e.message||'Password update failed')}
}
async function toggleLock(id,isLocked){
  const next=!isLocked;
  let reason='';
  if(next){
    reason=prompt('কোর্স লক করার কারণ লিখুন:','')?.trim()||'';
    if(!reason){toast('Lock reason required');return}
    if(!confirm('এই কারণসহ কোর্সটি লক করবেন?\n\n'+reason))return;
  }else{
    if(!confirm('Unlock this course for the student?'))return;
  }
  try{
    const r=await api('set_course_lock',{id,locked:next,reason});
    pageCache.delete(cacheKey());
    toast(r.message||'Updated');
    refresh();
  }catch(e){toast(e.message||'Update failed')}
}
async function toggleWt(id,isOn){
  const next=!isOn;
  try{
    const r=await api('set_get_wt',{id,value:next?'Yes':''});
    pageCache.delete(cacheKey());
    toast(r.message||'Updated');
    refresh();
  }catch(e){toast(e.message||'Update failed')}
}

if(S.token&&S.user)show();
</script></body></html>
